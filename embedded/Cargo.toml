[workspace]

[package]
name = "dekopon-embedded"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-bedrockruntime = { version = "=1.146.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "=1.8.0"
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.53.3", features = ["macros", "sync", "time"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
